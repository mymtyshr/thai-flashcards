<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タイ語">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>タイ語マイフレーズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="tabbar" aria-label="メインメニュー">

  <button data-action="nav" data-view="list" data-tab="list">一覧</button>
  <button data-action="nav" data-view="settings" data-tab="settings">設定</button>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>

</html>
